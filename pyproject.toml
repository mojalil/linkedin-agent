[project]
name = "linkedin-agent"
version = "0.1.0"
description = "A LinkedIn content automation agent using LangGraph"
authors = [
    {name = "Your Name"}
]
readme = "README.md"
requires-python = "^3.9"
dependencies = [
    "langgraph (>=0.4.7,<0.5.0)",
    "pydantic (>=2.11.5,<3.0.0)",
    "apify-client (>=1.10.0,<2.0.0)",
    "firecrawl (>=2.7.1,<3.0.0)",
    "langchain (>=0.3.25,<0.4.0)",
    "langchain-openai (>=0.3.18,<0.4.0)",
    "requests (>=2.32.3,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
